<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Was Heard Analysis</title>
<style>
:root{--bg:#f6f5f1;--card:#fffefb;--fg:#1d1c1a;--mut:#6b675f;--line:#e2ded4;--acc:#2a6f5b;--accbg:#e3efe9;--code:#f1efe8;--warn:#9a3b1c;--warnbg:#f8e9e2;--note:#7a5a10;--notebg:#f7efd9;
--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#8a63d2;--c5:#c2417a;--c6:#7a8a1f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#1f1e1b;--fg:#ecebe6;--mut:#a29e94;--line:#34322d;--acc:#6cc3a3;--accbg:#1e3029;--code:#262521;--warn:#f08a62;--warnbg:#3a2219;--note:#e7c46f;--notebg:#352c16;
--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#9b7ae0;--c5:#d0588c;--c6:#9aab2e;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:42px;height:42px;padding:0;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:18px;line-height:1;z-index:5;display:none}.totop.on{display:block}
a{color:var(--acc)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:980px;margin:0 auto;padding-block:24px 96px;padding-inline:16px;display:grid;gap:20px}
main>*,section{min-width:0}
html[lang=ko] .l-en,html[lang=en] .l-ko{display:none}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0;display:flex;gap:10px;align-items:center}
h2 .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--card);font-size:13px}
h3{font-size:14.5px;margin:0}
p{margin:0}
.mut{color:var(--mut)}.small{font-size:13px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:5px 12px}
.lang button.on{background:var(--fg);color:var(--bg)}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px}
.banner.note{background:var(--notebg);color:var(--note)}
.banner.err{background:var(--warnbg);color:var(--warn);white-space:pre-wrap;overflow-wrap:anywhere}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px}
section.off{opacity:.55}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:7px;padding:6px 12px;font-size:13.5px}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
button.danger{color:var(--warn);border-color:var(--warn)}
input,select,textarea{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;max-width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
label{display:inline-flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:var(--mut)}
.field select,.field textarea,.field input:not([type=checkbox]):not([type=radio]){width:100%}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
td.num,th.num{text-align:right}
code,.mono{font:12.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
details summary{cursor:pointer;color:var(--mut);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:var(--bg)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.rounds{display:grid;gap:10px}
.rc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.rc.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.kv b{font-variant-numeric:tabular-nums}
.res{display:grid;gap:10px}.res h3{margin:0}.resg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.resg>div{min-width:0}
a.btn{display:inline-block;text-decoration:none;font:inherit;font-size:13.5px;padding:7px 14px;border-radius:7px;border:1px solid var(--line);color:var(--fg);background:var(--card)}a.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
.job{display:grid;gap:6px;border:1px dashed var(--acc);border-radius:10px;padding:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.wait{color:var(--acc);font-weight:600}
.wait::before{content:"";display:inline-block;width:.7em;height:.7em;margin-right:.45em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-.05em;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bar.ind i{width:30%!important;animation:ind 1.3s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.wait::before{animation:none}.bar.ind i{animation:none;width:100%!important;opacity:.5}}
.clist{display:grid;gap:12px}
.cl{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.cl.ex{background:var(--warnbg);border-color:var(--warn)}
.clh{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.clh .meta{font-size:12.5px;color:var(--mut)}
.words{font-weight:600}
.comp{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);max-width:260px}
.comp i{display:block;height:100%}
.q{font-size:13.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px;overflow-wrap:anywhere}
.q .sp{font-size:12px;color:var(--mut)}
.votes{font-size:12px;color:var(--mut)}
.more{display:grid;gap:6px}.more .moretx{display:grid;gap:6px}.moreb{justify-self:start}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-radius:0;padding:6px 14px}
.seg button.on{background:var(--acc);color:var(--card);font-weight:600}
textarea{width:100%;min-height:90px;resize:vertical}
.field.wide{grid-column:1/-1}
.danger.arm{background:var(--warn);color:var(--card)}
.sticky{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 0 2px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pat td{padding:4px 6px}
.pat input.p{width:100%;min-width:220px}
.pat input.m{width:80px}
.tag{font-size:11.5px;color:var(--mut)}
.ok{color:var(--acc)}.bad{color:var(--warn)}
@media (max-width:600px){.clh{display:grid}}
</style></head><body><main>

<div class="top">
 <div class="row"><h1 data-k="title"></h1><a href="/" class="small" data-k="back"></a></div>
 <div class="lang" role="group" aria-label="Language"><button data-l="ko">한국어</button><button data-l="en">English</button></div>
</div>
<div class="banner note" data-k="privacy"></div>
<div class="banner err" id="err" hidden></div>

<!-- 프로젝트 -->
<section id="s0">
 <h2 data-k="proj_h"></h2>
 <div class="row">
  <select id="projSel"></select>
  <input id="newName" data-ph="new_ph" style="min-width:200px">
  <button id="newBtn" data-k="new_btn"></button>
  <button id="openDir" data-k="open_dir" hidden></button>
 </div>
 <p class="mut small" data-k="auto_proj"></p>
 <p class="mut small"><span data-k="work_at"></span> <code id="workRoot"></code></p>
</section>

<!-- 모델 -->
<section id="sM">
 <details id="mdlBox"><summary><b data-k="mdl_h"></b> <span id="mdlState" class="small"></span></summary>
  <div style="display:grid;gap:12px;margin-top:12px">
   <p class="small"><a id="mdlName" target="_blank" rel="noopener"><code></code></a> <span class="mut" id="mdlMeta"></span></p>
   <div class="field"><span data-k="mdl_dir"></span><div class="row"><input id="mdlDir" class="mono" style="flex:1 1 240px;min-width:0"><button id="mdlDirBtn" data-k="mdl_dir_save"></button><button id="mdlDirDef" data-k="mdl_dir_def"></button></div>
    <span class="small mut" data-k="mdl_dir_note"></span></div>
   <div class="row"><button class="pri" id="mdlDl" data-k="mdl_dl_now"></button><button class="danger" id="mdlDel" data-k="mdl_del"></button><span class="small" id="mdlMsg"></span></div>
  </div>
 </details>
</section>

<!-- 1 자료 -->
<section id="s1" class="off">
 <h2><span class="no">1</span><span data-k="s1"></span></h2>
 <p class="mut small" data-k="s1_d"></p>
 <div class="seg" role="tablist"><button class="sg on" data-m="file" data-k="m_file"></button><button class="sg" data-m="fetch" data-k="m_fetch"></button></div>
 <div class="grid2" id="mFile">
  <div class="field"><span data-k="upload"></span><input type="file" id="file" accept=".csv,.tsv,.xlsx,.xlsm"></div>
  <div class="field"><span data-k="bypath"></span><div class="row"><input id="pathIn" style="flex:1;min-width:0" placeholder="D:\data\comments.csv"><button id="pathBtn" data-k="load"></button></div></div>
 </div>
 <div id="mFetch" hidden style="display:grid;gap:12px">
  <div class="field"><span data-k="src"></span><select id="srcSel"></select></div>
  <p class="small mut" id="srcDesc"></p>
  <div class="grid2" id="srcForm"></div>
  <div class="row"><button class="pri" id="fetchBtn" data-k="fetch"></button></div>
 </div>
 <div class="job" id="fjob" hidden role="status" aria-live="polite"><div class="row"><b id="fjStage"></b><span class="small" id="fjCount"></span><span class="mut small" id="fjTime"></span><button class="danger" id="fstopBtn" data-k="fstop" hidden style="margin-left:auto"></button></div><div class="bar" id="fjBarW"><i id="fjBar" style="width:5%"></i></div><p class="mut small" id="fjDetail" style="overflow-wrap:anywhere"></p></div>
 <p class="small ok" id="fetchedNote"></p>
 <div id="colsBox" hidden>
  <p class="small"><b id="fname"></b> · <span id="nrows"></span></p>
  <div class="tw"><table id="colsTbl"></table></div>
 </div>
</section>

<!-- 2 설정 -->
<section id="s2" class="off">
 <h2><span class="no">2</span><span data-k="s2"></span></h2>
 <p class="small wait" id="s2wait" data-k="s2_wait" hidden></p>
 <div class="grid2">
  <div class="field"><span data-k="f_text"></span><select id="fText"></select></div>
  <div class="field"><span data-k="f_group"></span><select id="fGroup"></select></div>
  <div class="field"><span data-k="f_speaker"></span><select id="fSpeaker"></select></div>
 </div>
 <div id="gvals" class="small mut"></div>
 <div class="field"><span data-k="f_context"></span><div class="chips" id="fContext"></div></div>
 <div class="field"><span data-k="f_policy"></span>
  <label><input type="radio" name="pol" value="private" checked> <span data-k="pol_private"></span></label>
  <label><input type="radio" name="pol" value="quotes"> <span data-k="pol_quotes"></span></label>
  <label><input type="radio" name="pol" value="public"> <span data-k="pol_public"></span></label>
  <p class="mut small" data-k="pol_note"></p>
 </div>
 <details><summary data-k="adv"></summary>
  <div class="grid2" style="margin-top:10px">
   <div class="field"><span data-k="f_title"></span><input id="fTitle"></div>
   <div class="field"><span data-k="f_subject"></span><input id="fSubject"></div>
   <div class="field"><span data-k="f_pergroup"></span><input id="fPer" type="number" min="0" value="0"></div>
   <div class="field"><span data-k="f_minchars"></span><input id="fMin" type="number" min="0" value="5"></div>
   <div class="field"><span data-k="f_mingroup"></span><input id="fMinG" type="number" min="0" value="0"></div>
   <div class="field"><span data-k="f_embed"></span><input id="fEmb" type="number" min="50" placeholder="400"></div>
   <div class="field"><span data-k="f_sel"></span><select id="fSel"><option value="eom">eom</option><option value="leaf">leaf</option></select></div>
   <div class="field"><span data-k="f_mcs"></span><input id="fMcs" type="number" min="2" data-ph="auto"></div>
  </div>
  <div class="field" style="margin-top:10px"><span data-k="f_drop"></span>
   <div class="row"><select id="dCol"></select><select id="dVal"></select><button id="dAdd" data-k="add"></button></div>
   <div class="chips" id="dList"></div>
  </div>
 </details>
 <p class="banner note" id="colWarn" hidden></p>
 <p class="banner note" id="bigWarn" hidden></p>
 <div class="row"><button class="pri" id="saveSetup" data-k="save_setup"></button><span id="setupMsg" class="small"></span></div>
</section>

<!-- 3 차수 -->
<section id="s3" class="off">
 <h2><span class="no">3</span><span data-k="s3"></span></h2>
 <p class="mut small" data-k="s3_d"></p>
 <div class="rounds" id="rounds"></div>
 <div class="job" id="job" hidden role="status" aria-live="polite"><div class="row"><b id="jobStage"></b><span class="small" id="jobCount"></span><span class="mut small" id="jobTime"></span><button class="danger" id="jobStop" data-k="jstop" hidden style="margin-left:auto"></button></div><div class="bar"><i id="jobBar" style="width:5%"></i></div><p class="small" id="jobEta" hidden></p><p class="mut small" id="jobTip" data-k="job_tip" hidden></p><p class="small" id="jobModel" hidden style="overflow-wrap:anywhere"></p><p class="mut small" data-k="job_note"></p></div>
 <div class="row" id="runRow"><select id="runRules"></select><button class="pri" id="runBtn"></button><a id="goRes" href="#s6" class="small" data-k="res_go" hidden></a></div>
</section>

<!-- 4 판단 -->
<section id="s4" class="off">
 <h2><span class="no">4</span><span data-k="s4"></span> <span id="s4r" class="mut small"></span></h2>
 <p class="mut small" data-k="s4_d"></p>
 <div class="row">
  <div class="field"><span data-k="reviewer"></span><input id="rvName" style="width:160px"></div>
  <div class="field"><span data-k="others"></span><div class="chips" id="rvList"></div></div>
 </div>
 <div id="agr" class="small"></div>
 <div class="legend" id="legend"></div>
 <div class="clist" id="clist"></div>
 <div class="sticky"><button class="pri" id="saveRv" data-k="save_rv"></button><button id="applyLb" data-k="apply_lb"></button><span id="rvMsg" class="small"></span></div>
</section>

<!-- 5 규칙 -->
<section id="s5" class="off">
 <h2><span class="no">5</span><span data-k="s5"></span></h2>
 <p class="mut small" data-k="s5_d"></p>
 <div class="row">
  <label><input type="radio" name="pp" value="majority" checked> <span data-k="pp_major"></span></label>
  <label><input type="radio" name="pp" value="all"> <span data-k="pp_all"></span></label>
  <button id="draftBtn" data-k="draft"></button>
 </div>
 <div id="draftInfo" class="small"></div>
 <div class="tw"><table class="pat" id="patTbl"></table></div>
 <div class="row"><button id="addPat" data-k="add_pat" hidden></button></div>
 <div class="row" id="saveRulesRow" hidden><button class="pri" id="saveRules"></button><span id="rulesMsg" class="small"></span></div>
</section>

<section id="s6" class="off">
 <h2><span class="no">6</span><span data-k="s6"></span></h2>
 <p class="mut small" data-k="s6_d"></p>
 <div id="resBox"></div>
</section>
</main>
