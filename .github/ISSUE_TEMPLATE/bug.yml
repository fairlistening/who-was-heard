name: 오류 제보 · Bug report
description: 도구가 제대로 돌지 않을 때 · When the tool doesn't work as it should
title: "[오류 · Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **도구 오류만 받습니다.** 기능 추가 요청이나 기사 내용에 대한 의견은 받지 않습니다.
        **Bug reports only** — no feature requests or comments on the articles.

        ⚠️ **분석한 자료의 원문, 내부 검토판(`*_INTERNAL_do-not-share.*`), API 키는 절대 붙이지 마세요.** 이 게시판은 누구나 봅니다.
        ⚠️ **Never paste raw texts from your data, internal reports, or API keys.** This page is public.
  - type: dropdown
    id: os
    attributes:
      label: 운영체제 · Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: 실행 방법 · How you run it
      options:
        - 설치판 (Releases zip) · Installer build
        - 파이썬으로 start.pyw / start.command · Python, start.pyw / start.command
        - 파이썬 명령줄 (who-was-heard …) · Python, command line
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 어디서 났나 · Where it happened
      options:
        - 켜기 · 안내 페이지 · Starting / setup page
        - ① 자료 넣기 (파일) · Step 1, file
        - ① 직접 받기 · Step 1, fetch
        - ② 설정 · Step 2, settings
        - ③ 차수 실행 (임베딩·묶기) · Step 3, running a round
        - ④ 판단 · Step 4, review
        - ⑤ 규칙 · Step 5, rules
        - ⑥ 결과·보고서 · Step 6, results / reports
        - AI 앱 연결 (MCP) · Connecting an AI app (MCP)
        - 기타 · Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇을 했고, 무엇이 일어났나 · What you did and what happened
      description: 순서대로 적어 주세요. 자료는 「CSV 3만 행, 글 열 평균 80자」처럼 크기와 모양만. · Steps in order. Describe your data by size and shape only.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 오류 문구 · Error message
      description: 화면의 빨간 오류 문구를 그대로 붙여 주세요. · Paste the error shown on screen.
      render: text
  - type: textarea
    id: log
    attributes:
      label: 실행 기록 · Log
      description: |
        파이썬판은 저장소 폴더의 `_logs/start.log`, 설치판은 `~/.who-was-heard/logs/start.log` 마지막 30줄쯤. 원문이 섞여 있으면 지우고 붙이세요.
        Last ~30 lines of `_logs/start.log` (Python) or `~/.who-was-heard/logs/start.log` (installer). Remove any raw text first.
      render: text
  - type: input
    id: version
    attributes:
      label: 버전 · Version
      description: 설치판 태그(예 v0.1.0) 또는 커밋 · Release tag (e.g. v0.1.0) or commit
  - type: checkboxes
    id: privacy
    attributes:
      label: 확인 · Check
      options:
        - label: 자료 원문·내부 검토판·API 키를 붙이지 않았습니다 · I did not paste raw texts, internal reports or API keys
          required: true
